# appimage-builder recipe for the aarch64 "portable" KopiaUI AppImage.
# See app/AppImageBuilder.x86_64.yml for documentation.

version: 1

script:
  - mv "$APPDIR/kopia-ui" "$APPDIR/kopia-ui.bin" || true

AppDir:
  path: ./AppDir

  app_info:
    id: io.kopia.ui
    name: KopiaUI
    icon: kopia-ui
    version: !ENV ${KOPIA_VERSION_NO_V}
    exec: kopia-ui.bin
    exec_args: $@

  apt:
    arch:
      - arm64
    allow_unauthenticated: true
    sources:
      - sourceline: 'deb http://ports.ubuntu.com/ubuntu-ports/ jammy main restricted universe multiverse'
        key_url: 'http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'
      - sourceline: 'deb http://ports.ubuntu.com/ubuntu-ports/ jammy-updates main restricted universe multiverse'
      - sourceline: 'deb http://ports.ubuntu.com/ubuntu-ports/ jammy-security main restricted universe multiverse'

    include:
      - libc6
      - libgcc-s1
      - libstdc++6
      - libnss3
      - libnspr4
      - libgtk-3-0
      - libglib2.0-0
      - libgbm1
      - libdrm2
      - libxkbcommon0
      - libxcomposite1
      - libxdamage1
      - libxrandr2
      - libxfixes3
      - libxext6
      - libx11-xcb1
      - libxcb1
      - libxcb-dri3-0
      - libxshmfence1
      - libasound2
      - libcups2
      - libatk1.0-0
      - libatk-bridge2.0-0
      - libatspi2.0-0
      - libpangocairo-1.0-0
      - libpango-1.0-0
      - libcairo2
      - libfontconfig1
      - libfreetype6
      - libexpat1
      - libuuid1
      - libsecret-1-0
      - libdbus-1-3
      - libudev1
      - libgl1
      - libgl1-mesa-dri
      - libegl1
      - libgles2
      - libva-drm2
      - libva-x11-2
      - mesa-vulkan-drivers
      - fonts-liberation
      - fonts-dejavu-core
      - ca-certificates
      - locales
    exclude:
      - humanity-icon-theme
      - hicolor-icon-theme
      - adwaita-icon-theme
      - ubuntu-mono

  runtime:
    env:
      APPDIR_LIBRARY_PATH: "$APPDIR/usr/lib/aarch64-linux-gnu:$APPDIR/usr/lib:$APPDIR/lib/aarch64-linux-gnu:$APPDIR/lib"
      LD_LIBRARY_PATH: "$APPDIR/usr/lib/aarch64-linux-gnu:$APPDIR/usr/lib:$APPDIR/lib/aarch64-linux-gnu:$APPDIR/lib"
      GTK_PATH: "$APPDIR/usr/lib/aarch64-linux-gnu/gtk-3.0"
      GIO_MODULE_DIR: "$APPDIR/usr/lib/aarch64-linux-gnu/gio/modules"
      GDK_PIXBUF_MODULEDIR: "$APPDIR/usr/lib/aarch64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders"
      GDK_PIXBUF_MODULE_FILE: "$APPDIR/usr/lib/aarch64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders.cache"
      FONTCONFIG_PATH: "$APPDIR/etc/fonts"
      LIBVA_DRIVERS_PATH: "$APPDIR/usr/lib/aarch64-linux-gnu/dri"
      LIBGL_DRIVERS_PATH: "$APPDIR/usr/lib/aarch64-linux-gnu/dri"
      SSL_CERT_FILE: "$APPDIR/etc/ssl/certs/ca-certificates.crt"
      SSL_CERT_DIR: "$APPDIR/etc/ssl/certs"

    path_mappings:
      - /usr/share/fonts/:$APPDIR/usr/share/fonts/
      - /etc/fonts/:$APPDIR/etc/fonts/
      - /etc/ssl/certs/:$APPDIR/etc/ssl/certs/

AppImage:
  arch: aarch64
  sign-key: None
  update-information: !ENV "gh-releases-zsync|${REPO_OWNER:-kopia}|kopia|latest|KopiaUI-*-aarch64-portable.AppImage.zsync"
  file_name: !ENV "KopiaUI-${KOPIA_VERSION_NO_V}-aarch64-portable.AppImage"
