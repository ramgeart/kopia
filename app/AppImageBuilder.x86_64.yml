# appimage-builder recipe for the "portable" KopiaUI AppImage.
#
# This recipe takes the AppDir that electron-builder produces
# (dist/kopia-ui/linux-unpacked) and re-bundles it with a complete glibc +
# GTK/Chromium dependency stack drawn from Ubuntu 22.04. The resulting
# AppImage is fully self-contained and is expected to run on:
#
#   * glibc distros (Debian/Ubuntu/Fedora/Arch/openSUSE/...)
#   * musl distros (Alpine) -- without gcompat or the sgerrand glibc shim
#   * NixOS, Void, Guix and other non-FHS distros
#
# See app/portable-AppRun.sh for the runtime entry point.
#
# Invoked from app/Makefile (build-portable-appimage target).

version: 1

script:
  # appimage-builder copies the AppDir into AppDir/ before this hook runs.
  # We rename the electron-builder launcher so that our wrapper AppRun (which
  # appimage-builder generates from the runtime.path_mappings + env below and
  # which we then overwrite with portable-AppRun.sh) can invoke it.
  - mv "$APPDIR/kopia-ui" "$APPDIR/kopia-ui.bin" || true

AppDir:
  path: ./AppDir

  app_info:
    id: io.kopia.ui
    name: KopiaUI
    icon: kopia-ui
    version: !ENV ${KOPIA_VERSION_NO_V}
    # exec is the path inside the AppDir that AppRun will eventually invoke.
    # appimage-builder's generated AppRun would call it directly; our custom
    # AppRun (installed via the `script` hook below) wraps this with
    # musl-detection + sandbox/GPU fallbacks.
    exec: kopia-ui.bin
    exec_args: $@

  apt:
    arch:
      - amd64
    allow_unauthenticated: true
    sources:
      - sourceline: 'deb http://archive.ubuntu.com/ubuntu/ jammy main restricted universe multiverse'
        key_url: 'http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'
      - sourceline: 'deb http://archive.ubuntu.com/ubuntu/ jammy-updates main restricted universe multiverse'
      - sourceline: 'deb http://security.ubuntu.com/ubuntu/ jammy-security main restricted universe multiverse'

    include:
      # libc + runtime
      - libc6
      - libgcc-s1
      - libstdc++6
      # Chromium / Electron core deps
      - libnss3
      - libnspr4
      - libgtk-3-0
      - libglib2.0-0
      - libgbm1
      - libdrm2
      - libxkbcommon0
      - libxcomposite1
      - libxdamage1
      - libxrandr2
      - libxfixes3
      - libxext6
      - libx11-xcb1
      - libxcb1
      - libxcb-dri3-0
      - libxshmfence1
      - libasound2
      - libcups2
      - libatk1.0-0
      - libatk-bridge2.0-0
      - libatspi2.0-0
      - libpangocairo-1.0-0
      - libpango-1.0-0
      - libcairo2
      - libfontconfig1
      - libfreetype6
      - libexpat1
      - libuuid1
      - libsecret-1-0
      - libdbus-1-3
      - libudev1
      # GL / mesa stack (software rendering fallback)
      - libgl1
      - libgl1-mesa-dri
      - libegl1
      - libgles2
      - libva-drm2
      - libva-x11-2
      - mesa-vulkan-drivers
      # Fonts + locales + CAs (Alpine often lacks all three)
      - fonts-liberation
      - fonts-dejavu-core
      - ca-certificates
      - locales
    exclude:
      # These pull huge transitive trees and are unnecessary for Electron.
      - humanity-icon-theme
      - hicolor-icon-theme
      - adwaita-icon-theme
      - ubuntu-mono

  runtime:
    env:
      # All paths are resolved at runtime by appimage-builder via $APPDIR.
      APPDIR_LIBRARY_PATH: "$APPDIR/usr/lib/x86_64-linux-gnu:$APPDIR/usr/lib:$APPDIR/lib/x86_64-linux-gnu:$APPDIR/lib"
      LD_LIBRARY_PATH: "$APPDIR/usr/lib/x86_64-linux-gnu:$APPDIR/usr/lib:$APPDIR/lib/x86_64-linux-gnu:$APPDIR/lib"
      GTK_PATH: "$APPDIR/usr/lib/x86_64-linux-gnu/gtk-3.0"
      GIO_MODULE_DIR: "$APPDIR/usr/lib/x86_64-linux-gnu/gio/modules"
      GDK_PIXBUF_MODULEDIR: "$APPDIR/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders"
      GDK_PIXBUF_MODULE_FILE: "$APPDIR/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders.cache"
      FONTCONFIG_PATH: "$APPDIR/etc/fonts"
      LIBVA_DRIVERS_PATH: "$APPDIR/usr/lib/x86_64-linux-gnu/dri"
      LIBGL_DRIVERS_PATH: "$APPDIR/usr/lib/x86_64-linux-gnu/dri"
      # CA bundle for Electron / Node TLS
      SSL_CERT_FILE: "$APPDIR/etc/ssl/certs/ca-certificates.crt"
      SSL_CERT_DIR: "$APPDIR/etc/ssl/certs"

    path_mappings:
      # Redirect host font lookups to bundled fonts. Critical on Alpine, which
      # typically has /usr/share/fonts present-but-empty.
      - /usr/share/fonts/:$APPDIR/usr/share/fonts/
      - /etc/fonts/:$APPDIR/etc/fonts/
      # Redirect host CA store to bundled (Alpine puts it elsewhere).
      - /etc/ssl/certs/:$APPDIR/etc/ssl/certs/

AppImage:
  arch: x86_64
  # Don't sign during CI by default; release workflow can opt-in.
  sign-key: None
  update-information: !ENV "gh-releases-zsync|${REPO_OWNER:-kopia}|kopia|latest|KopiaUI-*-x86_64-portable.AppImage.zsync"
  file_name: !ENV "KopiaUI-${KOPIA_VERSION_NO_V}-x86_64-portable.AppImage"
